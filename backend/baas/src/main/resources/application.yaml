spring:
  application:
    name: baas

  datasource:
    url: jdbc:postgresql://localhost:5432/neide_confeitaria
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: "${app.hibernate.dialect:org.hibernate.dialect.PostgreSQLDialect}"

server:
  port: 8080

upload:
  dir: uploads

app:
  jwt:
    # Segredo HS256 (>= 32 bytes). Produção: export JWT_SECRET=<aleatório>.
    secret: "${JWT_SECRET:}"
    expiration-hours: 12
  cors:
    # Origens do frontend separadas por vírgula (sem "*" quando há credencial).
    allowed-origins: "${APP_CORS_ORIGINS:http://localhost:3000}"