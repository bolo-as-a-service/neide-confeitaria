spring:
  application:
    name: baas
  datasource:
    url: jdbc:postgresql://localhost:5432/neide_confeitaria
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
